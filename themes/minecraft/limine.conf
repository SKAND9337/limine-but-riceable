# Sample limine.conf using Minegrub Theme
timeout: 5
interface_resolution: 1920x1080
theme_path: boot():/themes/minecraft/theme.txt

/CachyOS Linux
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=xxxx rw quiet
    module_path: boot():/initramfs-linux-cachyos.img

/CachyOS Linux (fallback)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=xxxx rw
    module_path: boot():/initramfs-linux-cachyos-fallback.img

/UEFI Firmware Settings
    protocol: efi_chainload
    image_path: boot():/EFI/BOOT/BOOTX64.EFI
