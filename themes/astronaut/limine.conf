# Limine Configuration using Astronaut Theme
timeout: 5
default_entry: 1

# Path to the theme definition
theme: boot():/themed-limine/theme.txt

/CachyOS Linux
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=... rw quiet splash
    initrd_path: boot():/initramfs-linux-cachyos.img

/CachyOS Linux (fallback)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=... rw
    initrd_path: boot():/initramfs-linux-cachyos-fallback.img

/UEFI Firmware Settings
    protocol: efi_chainload
