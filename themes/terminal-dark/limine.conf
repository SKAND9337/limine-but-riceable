# Sample limine.conf using Terminal Dark Theme
timeout: 5
interface_resolution: 1920x1080
theme_path: boot():/themes/terminal-dark/theme.txt

/CachyOS Linux (Kernel 6.13)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux-cachyos
    kernel_cmdline: root=UUID=xxxx rw quiet
    module_path: boot():/initramfs-linux-cachyos.img

/Arch Linux (Fallback)
    protocol: linux
    kernel_path: boot():/vmlinuz-linux
    kernel_cmdline: root=UUID=xxxx rw
    module_path: boot():/initramfs-linux-fallback.img

/UEFI Firmware Setup
    protocol: efi_chainload
    image_path: boot():/EFI/BOOT/BOOTX64.EFI
