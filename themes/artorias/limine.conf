# ==============================================================================
# Limine Bootloader Configuration with Artorias Dark Fantasy Theme
# Configured with user's actual installed CachyOS kernels & system options
# ==============================================================================

timeout: 5
interface_resolution: 1920x1080
theme: boot():/themes/artorias/theme.txt

/CachyOS Linux (linux-cachyos)
    comment: Kernel version: 7.2.11-1-cachyos
    comment: kernel-id=linux-cachyos
    protocol: linux
    path: boot():/418735f5fd9b45c58ccd4316e27192b6/linux-cachyos/vmlinuz-linux-cachyos
    module_path: boot():/418735f5fd9b45c58ccd4316e27192b6/linux-cachyos/initramfs-linux-cachyos
    cmdline: quiet nowatchdog splash rw rootflags=subvol=/@ root=UUID=bfd3a5c6-2269-488e-b1c3-89563911d3f5

/CachyOS Linux (linux-cachyos-bore)
