# Limine Configuration - Cyberpunk 2077 Night City Spatial Edition
timeout: 8

# Graphical Theme
THEME=boot():/themes/cyberpunk-2077/theme.txt

/Arch Linux
    comment: Night City Netrunner 6.12
    protocol: limine
    kernel_path: boot():/vmlinuz-linux-zen
    cmdline: root=UUID=cyberpunk-root-uuid rw quiet
    module_path: boot():/initramfs-linux-zen.img

/CachyOS
    comment: BORE Neural Core x86-64-v4
    protocol: limine
    kernel_path: boot():/vmlinuz-linux-cachyos
    cmdline: root=UUID=cachy-root-uuid rw quiet
    module_path: boot():/initramfs-linux-cachyos.img

/Windows 11
    comment: Arasaka Relic Subsystem
    protocol: efi_chainload
    image_path: boot():/EFI/Microsoft/Boot/bootmgfw.efi

/UEFI Setup
    comment: Motherboard Firmware
    protocol: efi_firmware

/Reboot
    comment: Power Cycle Cyberdeck
    protocol: reboot

/Power Off
    comment: Neural Disconnect
    protocol: poweroff
